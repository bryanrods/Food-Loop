<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Packs Disponibles - Food Loop</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2D6A4F">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .packs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        /* ESTILOS DEL MODAL BRUTALISTA */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--color-accent); border: 4px solid var(--color-primary); padding: 30px;
            max-width: 400px; width: 90%; position: relative; box-shadow: 8px 8px 0px var(--color-primary);
        }
        .close-modal {
            position: absolute; top: 10px; right: 15px; font-size: 2rem; cursor: pointer;
            color: var(--color-primary); font-weight: bold; transition: transform 0.2s;
        }
        .close-modal:hover { transform: scale(1.2); }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="navbar-container">
            <a href="dashboard-usuario.html" class="logo-brand" style="text-decoration: none;">
                <span><i class="fas fa-arrow-left"></i> Volver al Panel</span>
            </a>
            <nav class="nav-menu" id="navMenu">
                <a href="dashboard-usuario.html" class="nav-link">Mi Panel</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="dashboard-section" style="min-height: 70vh;">
            <div class="dashboard-header">
                <h2>Packs Disponibles</h2>
                <p>Rescata estos deliciosos packs antes de que cierre el local.</p>
            </div>

            <div id="contenedor-packs" class="packs-grid">
                <p style="text-align: center; width: 100%; color: var(--color-primary); font-weight: bold;">
                    <i class="fas fa-spinner fa-spin"></i> Buscando las mejores ofertas para ti...
                </p>
            </div>
        </section>

        <div id="modal-apartado" class="modal-overlay">
            <div class="modal-content">
                <span class="close-modal" onclick="cerrarModal()">&times;</span>
                
                <h3 id="modal-nombre" style="color: var(--color-primary); margin-bottom: 5px; border-bottom: 2px solid var(--color-primary); padding-bottom: 10px; font-size: 1.5rem;"></h3>
                <p style="font-size: 1rem; color: #555; margin-bottom: 15px;"><i class="fas fa-store"></i> <span id="modal-local"></span></p>
                
                <div style="background: var(--color-primary); color: var(--color-accent); padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 20px;">
                    <p style="margin: 0; font-weight: bold; font-size: 1.1rem;">Disponibles: <span id="modal-stock"></span> piezas</p>
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px;">
                    <label style="font-weight: bold; color: var(--color-primary); font-size: 1.1rem;">¿Cuántos apartarás?</label>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button onclick="cambiarCantidad(-1)" class="btn" style="padding: 5px 15px; font-size: 1.2rem;">-</button>
                        <span id="modal-cantidad" style="font-size: 1.5rem; font-weight: 900; color: #d32f2f;">1</span>
                        <button onclick="cambiarCantidad(1)" class="btn" style="padding: 5px 15px; font-size: 1.2rem;">+</button>
                    </div>
                </div>

                <button onclick="confirmarApartado()" class="btn" style="width: 100%; padding: 15px; font-size: 1.1rem;">Confirmar Apartado</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-brand">
                <i class="fas fa-leaf"></i> Food Loop
                <p>Transformamos inventario en flujo de efectivo.</p>
            </div>
            <div class="footer-bottom" style="width: 100%;">
                <p>&copy; 2026 Food Loop Technologies.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        let estadoSuscripcionActual = 'inactiva';
        let usuarioGlobal = null;
        
        // Variables para el motor del Modal
        let packActivo = null;
        let cantidadElegida = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            const usuarioGuardado = localStorage.getItem('usuarioFoodLoop');
            if (!usuarioGuardado) return window.location.href = 'login.html';
            usuarioGlobal = JSON.parse(usuarioGuardado);

            try {
                const response = await fetch(`http://localhost:3005/api/me`, { headers: { 'user-id': usuarioGlobal.id } });
                const data = await response.json();
                if (data.success) estadoSuscripcionActual = data.user.estado_suscripcion || 'inactiva';
            } catch (error) { console.error("Error:", error); }

            cargarPacksDisponibles();
        });

        async function cargarPacksDisponibles() {
            const contenedor = document.getElementById('contenedor-packs');
            try {
                const response = await fetch('http://localhost:3005/api/packs');
                const packs = await response.json();
                contenedor.innerHTML = ''; 

                if (packs.length === 0) {
                    contenedor.innerHTML = `<p style="text-align:center; width:100%; font-weight:bold;">No hay packs disponibles por ahora.</p>`;
                    return;
                }

                packs.forEach(pack => {
                    const visualHTML = pack.foto_pack 
                        ? `<img src="${pack.foto_pack}" style="width: 100%; height: 180px; object-fit: cover; border-bottom: 2px solid var(--color-primary);">`
                        : `<div style="height: 180px; border-bottom: 2px solid var(--color-primary); background: var(--color-primary); display:flex; align-items:center; justify-content:center;"><i class="fas fa-box-open fa-4x" style="color:var(--color-accent);"></i></div>`;

                    const card = `
                        <div class="dashboard-card" style="padding: 0; overflow: hidden; display: flex; flex-direction: column;">
                            ${visualHTML}
                            <div style="padding: 20px; display: flex; flex-direction: column; flex-grow: 1;">
                                <h3 style="margin:0; font-size:1.2rem; color:var(--color-primary);">${pack.nombre_pack}</h3>
                                <p style="font-size:0.85rem; margin-top:5px; color:#555;"><i class="fas fa-store"></i> ${pack.nombre_comercio || 'Negocio Local'}</p>
                                <p style="font-size:0.9rem; margin-top:10px; flex-grow:1;">${pack.descripcion}</p>
                                
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px; border-top: 2px dashed var(--color-primary); padding-top: 15px;">
                                    <p style="margin:0; font-size:1.5rem; font-weight:900; color:#d32f2f;">$${parseFloat(pack.precio_descuento).toFixed(2)}</p>
                                    <button class="btn" style="padding: 8px 15px;" onclick="abrirModal(${pack.id_pack}, \`${pack.nombre_pack}\`, \`${pack.nombre_comercio || 'Local'}\`, ${pack.stock_disponible})">Ver más</button>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += card;
                });
            } catch (error) {
                contenedor.innerHTML = '<p style="color: red; text-align: center; width: 100%;">Error al cargar el catálogo.</p>';
            }
        }

        // ==========================================
        // MOTOR DEL MODAL Y APARTADOS
        // ==========================================
        window.abrirModal = function(id, nombre, local, stock) {
            if (estadoSuscripcionActual !== 'activa') {
                return Swal.fire({
                    title: '¡Oferta Bloqueada!',
                    text: 'Activa tu membresía presentando tu folio en un local.',
                    icon: 'lock',
                    confirmButtonColor: '#d32f2f'
                });
            }
            
            packActivo = { id, nombre, local, stock };
            cantidadElegida = 1; // Reseteamos a 1
            
            document.getElementById('modal-nombre').innerText = nombre;
            document.getElementById('modal-local').innerText = local;
            document.getElementById('modal-stock').innerText = stock;
            document.getElementById('modal-cantidad').innerText = cantidadElegida;
            
            document.getElementById('modal-apartado').style.display = 'flex';
        }

        window.cerrarModal = function() {
            document.getElementById('modal-apartado').style.display = 'none';
        }

        window.cambiarCantidad = function(cambio) {
            let nuevaCantidad = cantidadElegida + cambio;
            // El candado: No menos de 1, no más del stock disponible
            if (nuevaCantidad >= 1 && nuevaCantidad <= packActivo.stock) {
                cantidadElegida = nuevaCantidad;
                document.getElementById('modal-cantidad').innerText = cantidadElegida;
            }
        }

        window.confirmarApartado = async function() {
            try {
                const response = await fetch('http://localhost:3005/api/reservar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuario_id: usuarioGlobal.id,
                        pack_id: packActivo.id,
                        cantidad: cantidadElegida
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    cerrarModal();
                    Swal.fire({
                        title: '¡Apartado exitoso!',
                        text: `Salvaste ${cantidadElegida}x ${packActivo.nombre}.`,
                        icon: 'success',
                        confirmButtonColor: '#2D6A4F',
                        confirmButtonText: 'Ver mis compras'
                    }).then(() => {
                        window.location.href = 'mis-compras.html';
                    });
                } else {
                    Swal.fire('Error', data.message, 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'No se pudo conectar con el servidor', 'error');
            }
        }
    </script>
</body>
</html>
